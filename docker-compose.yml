networks:
  network:
    driver: bridge

volumes:
  pg_data:

services:
  web:
    ports:
      - ${WEB_PORT}:${WEB_PORT}
    networks:
      - network
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - SCRIPT=${SCRIPT:-entrypoint.sh}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
  redis:
    networks:
      - network
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    networks:
      - network
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: django
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '2309'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

